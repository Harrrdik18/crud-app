name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src test

      - name: Unit tests
        run: npm test

  integration:
    name: Service integration tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobhunt
          POSTGRES_PASSWORD: jobhunt
          POSTGRES_DB: jobhunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhunt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: docker exec ${{ job.services.postgres.id }} psql -U jobhunt -d postgres -c "CREATE DATABASE jobhunt_test;"

      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://jobhunt:jobhunt@localhost:5432/jobhunt_test